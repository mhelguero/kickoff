# Builds the APK on every push to main and publishes it as the latest release.
# Phone download link: https://github.com/<owner>/kickoff/releases/latest/download/Kickoff.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD repository secrets first (see README)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kickoff.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/kickoff.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }}

      - run: cp app/build/outputs/apk/release/app-release.apk Kickoff.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kickoff 1.${{ github.run_number }}
          files: Kickoff.apk
          make_latest: true
